<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1180" viewBox="0 0 900 1180" role="img" aria-labelledby="title desc">
  <title id="title">Synthetic middle handwritten response</title>
  <desc id="desc">An original synthetic economics answer written on ruled paper.</desc>
  <defs>
    <pattern id="lines" width="900" height="54" patternUnits="userSpaceOnUse"><rect width="900" height="54" fill="#fffdf6"/><path d="M0 53.5H900" stroke="#b9d5e0" stroke-width="1"/></pattern>
    <filter id="shadow"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#18352f" flood-opacity=".15"/></filter>
  </defs>
  <rect x="28" y="22" width="844" height="1136" rx="5" fill="url(#lines)" filter="url(#shadow)"/>
  <path d="M112 22V1158" stroke="#e6a6a0" stroke-width="2"/>
  <g fill="#263e6b" font-family="'Comic Sans MS','Segoe Print',cursive" font-size="26">
    <text x="140" y="91" transform="rotate(-.25 140 91)">When the central bank raises interest rates,</text>
    <text x="140" y="145">loans and credit become more expensive.</text>
    <text x="140" y="199" transform="rotate(.2 140 199)">Households may borrow less and reduce</text>
    <text x="140" y="253">consumption, while firms may cut investment.</text>
    <text x="140" y="307" transform="rotate(-.15 140 307)">Aggregate demand therefore falls, which can</text>
    <text x="140" y="361">reduce demand-pull inflation.</text>
    <text x="140" y="469" transform="rotate(.2 140 469)">However, if inflation is caused by higher oil</text>
    <text x="140" y="523">prices, lower demand may not remove the</text>
    <text x="140" y="577">original cost increase. The policy may reduce</text>
    <text x="140" y="631" transform="rotate(-.2 140 631)">inflation, but it depends on what caused it.</text>
  </g>
  <text x="752" y="1100" fill="#887a67" font-family="Georgia,serif" font-size="16">SYN-M01</text>
</svg>
