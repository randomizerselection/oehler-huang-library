<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <title>Investment Scheme of Work</title>
  <style>
    /* MAINTENANCE: change colours and spacing here; lesson content is in COURSE DATA below. */
    :root {
      --navy: #173a55;
      --blue: #315f76;
      --green: #5b8c43;
      --green-dark: #426d30;
      --ink: #193650;
      --muted: #617184;
      --line: #c8d4dc;
      --page: #f3f6f2;
      --card: #ffffff;
      --cream: #fff6df;
      --peach: #f7e7da;
      --sage: #edf5e9;
      --ice: #f1f6fa;
      --shadow: 0 10px 28px rgba(23, 58, 85, .08);
      --radius: 16px;
      --content-width: 1720px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--page);
      font-family: Inter, "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
      line-height: 1.45;
    }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    a { color: inherit; }
    [hidden] { display: none !important; }

    .toolbar {
      position: sticky;
      top: 0;
      z-index: 30;
      border-bottom: 1px solid rgba(23, 58, 85, .16);
      background: rgba(255, 255, 255, .96);
      backdrop-filter: blur(12px);
    }
    .toolbar__inner {
      width: min(var(--content-width), calc(100% - 32px));
      margin: 0 auto;
      padding: 10px 0;
      display: flex;
      align-items: center;
      gap: 7px;
      flex-wrap: wrap;
    }
    .brand {
      margin-right: auto;
      color: var(--navy);
      font-size: 14px;
      font-weight: 800;
      letter-spacing: .01em;
      white-space: nowrap;
    }
    .control, .button {
      min-height: 38px;
      border: 1px solid #b9c8d2;
      border-radius: 9px;
      background: #fff;
      color: var(--navy);
    }
    .control { padding: 7px 9px; }
    .search { width: min(220px, 42vw); }
    #group-filter { width: 190px; max-width: 24vw; }
    .button {
      padding: 7px 9px;
      font-size: 13px;
      font-weight: 700;
    }
    .button:hover, .button:focus-visible { border-color: var(--green); box-shadow: 0 0 0 3px rgba(91, 140, 67, .14); }
    .button--primary { border-color: var(--green); background: var(--green); color: #fff; }
    .button--primary:hover { background: var(--green-dark); }
    .button[aria-pressed="true"] { border-color: var(--navy); background: var(--navy); color: #fff; }
    .status {
      width: min(var(--content-width), calc(100% - 32px));
      min-height: 20px;
      margin: 0 auto;
      padding: 0 0 6px;
      color: var(--muted);
      font-size: 12px;
    }

    .shift-panel {
      width: min(var(--content-width), calc(100% - 32px));
      margin: 0 auto;
      padding: 10px 0 12px;
      display: none;
      align-items: center;
      gap: 9px;
      flex-wrap: wrap;
      color: var(--navy);
      font-size: 13px;
    }
    .editing .shift-panel { display: flex; }
    .shift-panel input { width: 72px; }

    .hero {
      color: #fff;
      background:
        radial-gradient(circle at 92% 8%, rgba(128, 172, 91, .34), transparent 28%),
        linear-gradient(135deg, #173a55 0%, #244e69 64%, #315f76 100%);
    }
    .hero__inner {
      width: min(var(--content-width), calc(100% - 32px));
      margin: 0 auto;
      padding: clamp(42px, 7vw, 92px) 0 46px;
    }
    .eyebrow {
      margin: 0 0 12px;
      color: #d8ead0;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    h1 {
      max-width: 1050px;
      margin: 0;
      font-size: clamp(34px, 5vw, 68px);
      line-height: 1.03;
      letter-spacing: -.035em;
    }
    .intro {
      max-width: 1220px;
      margin: 20px 0 0;
      color: #e9f0f4;
      font-size: clamp(15px, 1.7vw, 20px);
    }
    .intro--zh { margin-top: 8px; color: #d2e3ea; }
    .metrics {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 26px;
    }
    .metric {
      padding: 8px 11px;
      border: 1px solid rgba(255, 255, 255, .26);
      border-radius: 999px;
      background: rgba(255, 255, 255, .08);
      color: #fff;
      font-size: 13px;
      font-weight: 700;
    }

    .overview {
      width: min(var(--content-width), calc(100% - 32px));
      margin: -22px auto 34px;
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }
    .overview__card {
      padding: 18px 20px;
      border: 1px solid #d6e0e5;
      border-radius: var(--radius);
      background: #fff;
      box-shadow: var(--shadow);
    }
    .overview__card h2 { margin: 0 0 7px; color: var(--green-dark); font-size: 17px; }
    .overview__card p { margin: 0; color: var(--muted); font-size: 13px; }
    .overview__card .zh { margin-top: 5px; color: #526a7c; }

    .subject-content, .glossary, .detail-intro {
      width: min(var(--content-width), calc(100% - 32px));
      margin-left: auto;
      margin-right: auto;
    }
    .subject-content { margin-bottom: 48px; }
    .section-intro {
      margin-bottom: 18px;
      padding: 18px 20px;
      border-left: 5px solid var(--green);
      background: #fff;
      box-shadow: var(--shadow);
    }
    .section-intro h2 { margin: 2px 0 7px; color: var(--navy); font-size: clamp(24px, 3vw, 38px); }
    .section-intro p { max-width: 1120px; margin: 0; color: var(--muted); }
    .topic-block {
      margin: 0 0 28px;
      border: 1px solid #d3dde3;
      background: #fff;
      box-shadow: var(--shadow);
    }
    .topic__header {
      display: grid;
      grid-template-columns: 58px minmax(0, 1fr);
      gap: 12px;
      padding: 20px 22px 17px;
      border-bottom: 1px solid var(--line);
    }
    .topic__number { color: #111; font-size: 30px; font-weight: 900; line-height: 1.1; }
    .topic__title { margin: 0; color: #111; font-size: clamp(23px, 2.5vw, 34px); line-height: 1.12; }
    .topic__title .zh { display: block; margin-top: 4px; color: var(--muted); font-size: 14px; font-weight: 600; }
    .topic__intro { grid-column: 1 / -1; margin: 2px 0 0; color: #243f53; font-size: 16px; }
    .topic__intro--zh { margin-top: -5px; color: var(--muted); font-size: 13px; }
    .subtopic { padding: 0 14px 15px; }
    .subtopic + .subtopic { padding-top: 2px; }
    .subtopic__header {
      display: grid;
      grid-template-columns: 70px minmax(0, 1fr);
      gap: 0;
      margin: 0 0 4px;
      padding: 10px 14px;
      background: var(--peach);
    }
    .subtopic__number, .subtopic__title { color: #111; font-size: 17px; font-weight: 900; }
    .subtopic__title .zh { margin-left: 8px; color: #6f6158; font-size: 13px; font-weight: 600; }
    .content-statement {
      display: grid;
      grid-template-columns: 84px minmax(0, 1fr) auto;
      column-gap: 10px;
      padding: 11px 14px 12px;
      border-bottom: 1px solid #e1e7eb;
    }
    .content-statement:last-child { border-bottom: 0; }
    .content-ref { color: #111; font-size: 15px; font-weight: 700; }
    .content-statement h4 { margin: 0; color: #111; font-size: 16px; }
    .content-points { grid-column: 2 / 3; margin: 7px 0 0; padding-left: 21px; color: #213d52; }
    .content-points li { margin: 3px 0; padding-left: 2px; }
    .content-terms { grid-column: 2 / 3; margin-top: 6px; color: var(--muted); font-size: 11px; }
    .content-terms a { color: var(--green-dark); font-weight: 700; text-decoration: none; }
    .content-terms a:hover, .content-terms a:focus-visible { text-decoration: underline; }
    .content-lesson {
      grid-column: 3;
      grid-row: 1 / 3;
      align-self: start;
      min-width: 104px;
      padding: 4px 7px;
      border: 1px solid #c7d3da;
      border-radius: 7px;
      color: var(--muted);
      font-size: 10px;
      text-align: center;
    }

    .detail-intro { margin-bottom: 14px; }
    .detail-intro h2 { margin: 0; color: var(--navy); font-size: clamp(25px, 3vw, 38px); }
    .detail-intro p { max-width: 1050px; margin: 6px 0 0; color: var(--muted); }

    .scheme {
      width: min(var(--content-width), calc(100% - 32px));
      margin: 0 auto 80px;
    }
    .unit { margin: 0 0 42px; scroll-margin-top: 102px; }
    .unit__header {
      position: relative;
      margin-bottom: 12px;
      padding: 15px 18px;
      border-radius: 12px;
      color: #fff;
      background: var(--blue);
      box-shadow: var(--shadow);
    }
    .unit__header h2 { margin: 0; font-size: clamp(18px, 2vw, 25px); }
    .unit__header .zh { margin-left: 7px; color: #dcebf1; font-weight: 600; }
    .unit__count { margin-top: 3px; color: #dcebf1; font-size: 12px; font-weight: 700; }

    .lesson-list { display: grid; gap: 13px; }
    .lesson {
      overflow: hidden;
      border: 1px solid #ced9df;
      border-radius: var(--radius);
      background: var(--card);
      box-shadow: var(--shadow);
    }
    .lesson--taught { border-color: #9fbe90; }
    .lesson__header {
      display: grid;
      grid-template-columns: 250px minmax(0, 1fr);
      border-bottom: 1px solid var(--line);
    }
    .lesson__meta { padding: 15px 17px; background: var(--cream); }
    .lesson--taught .lesson__meta { background: var(--sage); }
    .lesson__number-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .lesson__number { color: var(--green-dark); font-size: 19px; font-weight: 900; }
    .lesson__content-ref { margin-top: 2px; color: var(--navy); font-size: 13px; font-weight: 900; }
    .lesson-status {
      padding: 2px 7px;
      border: 1px solid #83ab70;
      border-radius: 999px;
      color: #355d25;
      background: #fff;
      font-size: 9px;
      font-weight: 900;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .lesson__date { margin-top: 3px; font-weight: 800; }
    .lesson__focus { margin-top: 5px; color: var(--navy); }
    .lesson__note { margin-top: 6px; color: #826b31; font-size: 12px; }
    .lesson__source { margin-top: 7px; color: #536d48; font-size: 10px; line-height: 1.3; }
    .lesson__source strong { color: #355d25; }
    .print-unit-label { display: none; }
    .lesson__enquiry { padding: 15px 20px; background: linear-gradient(90deg, var(--sage), #f7faf5); }
    .kicker { color: var(--green-dark); font-size: 11px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; }
    .lesson__enquiry h3 { margin: 4px 0 0; color: var(--navy); font-size: clamp(18px, 2vw, 25px); line-height: 1.22; }

    .lesson__grid {
      display: grid;
      grid-template-columns: minmax(240px, 1.06fr) minmax(360px, 1.55fr) minmax(220px, .82fr) minmax(220px, .82fr);
    }
    .panel { min-width: 0; padding: 15px 17px 17px; border-right: 1px solid var(--line); }
    .panel:last-child { border-right: 0; }
    .panel--objectives { background: #fbfdf9; }
    .panel--progression { background: var(--ice); }
    .panel--evidence { background: var(--sage); }
    .panel--knowledge { background: #f6f8fa; }
    .panel h4 { margin: 0 0 10px; color: var(--green-dark); font-size: 13px; letter-spacing: .02em; }
    .objectives { margin: 0; padding: 0; list-style: none; counter-reset: objectives; }
    .objectives li {
      counter-increment: objectives;
      position: relative;
      margin: 0 0 10px;
      padding-left: 29px;
    }
    .objectives li::before {
      content: counter(objectives);
      position: absolute;
      left: 0;
      top: 0;
      width: 21px;
      height: 21px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: #fff;
      background: var(--green);
      font-size: 11px;
      font-weight: 900;
    }
    .objective__en { font-size: 13px; font-weight: 700; }
    .objective__zh { display: block; margin-top: 2px; color: var(--muted); font-size: 12px; }

    .phases { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .phase {
      min-width: 0;
      padding: 9px 10px;
      border: 1px solid #d5e0e7;
      border-radius: 9px;
      background: #fff;
    }
    .phase__head { display: flex; align-items: baseline; gap: 6px; margin-bottom: 3px; }
    .phase__time { color: var(--green-dark); font-size: 11px; font-weight: 900; }
    .phase__name { color: var(--navy); font-size: 12px; font-weight: 900; }
    .phase__task { color: #334f66; font-size: 12px; }

    .evidence-block + .evidence-block { margin-top: 14px; padding-top: 12px; border-top: 1px solid #cbdac5; }
    .evidence-block strong { display: block; margin-bottom: 3px; color: var(--navy); font-size: 12px; }
    .evidence-block div { font-size: 12px; }
    .terms { margin: 0; padding-left: 17px; }
    .terms li { margin-bottom: 5px; font-size: 12px; }
    .definition-link { margin-left: 3px; color: var(--green-dark); font-size: 10px; font-weight: 800; text-decoration: none; }
    .definition-link:hover, .definition-link:focus-visible { text-decoration: underline; }
    .formula { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); color: var(--navy); font-size: 12px; }
    .formula strong { color: var(--green-dark); }

    .glossary { margin-top: 54px; margin-bottom: 80px; }
    .glossary__sources { margin-top: 8px; color: #6d7d89; font-size: 11px; }
    .glossary-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 9px; }
    .glossary-card {
      scroll-margin-top: 92px;
      padding: 13px 14px;
      border: 1px solid #ced9df;
      border-radius: 10px;
      background: #fff;
      box-shadow: 0 5px 16px rgba(23, 58, 85, .05);
    }
    .glossary-card h3 { margin: 0; color: var(--navy); font-size: 14px; }
    .glossary-card h3 .zh { margin-left: 5px; color: var(--green-dark); font-size: 12px; font-weight: 700; }
    .glossary-card p { margin: 6px 0 0; color: #334f66; font-size: 12px; }
    .glossary-card__meta { margin-top: 7px; color: var(--muted); font-size: 9px; }

    .edit-actions { display: none; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
    .editing .edit-actions { display: flex; }
    .mini-button {
      padding: 4px 8px;
      border: 1px solid rgba(255, 255, 255, .45);
      border-radius: 7px;
      background: rgba(255, 255, 255, .12);
      color: inherit;
      font-size: 11px;
      font-weight: 800;
    }
    .lesson .mini-button { border-color: #b9c8d2; background: #fff; color: var(--navy); }

    .editable { border-radius: 3px; }
    .editing .editable {
      outline: 1px dashed rgba(91, 140, 67, .8);
      outline-offset: 2px;
      background: rgba(255, 255, 255, .72);
      cursor: text;
    }
    .editing .editable:focus { outline: 2px solid var(--green); background: #fff; }
    .empty { color: #8795a1; font-style: italic; }
    .no-results { padding: 38px; border: 1px dashed #aebdc7; border-radius: 14px; text-align: center; background: #fff; }

    @media (max-width: 1250px) {
      .lesson__grid { grid-template-columns: 1fr 1.4fr; }
      .panel:nth-child(2) { border-right: 0; }
      .panel:nth-child(-n+2) { border-bottom: 1px solid var(--line); }
      .glossary-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 820px) {
      .toolbar { position: static; }
      .toolbar__inner { align-items: stretch; }
      .brand { width: 100%; }
      .search { width: 100%; }
      #group-filter { width: 100%; max-width: none; }
      .overview { grid-template-columns: 1fr; }
      .lesson__header, .lesson__grid { grid-template-columns: 1fr; }
      .lesson__meta, .panel { border-right: 0; border-bottom: 1px solid var(--line); }
      .panel:last-child { border-bottom: 0; }
      .phases { grid-template-columns: 1fr; }
      .hero__inner { padding-top: 38px; }
      .topic__header { grid-template-columns: 42px minmax(0, 1fr); padding: 16px 14px 14px; }
      .topic__number { font-size: 25px; }
      .topic__intro { font-size: 14px; }
      .subtopic { padding-left: 7px; padding-right: 7px; }
      .subtopic__header { grid-template-columns: 58px minmax(0, 1fr); padding: 9px 10px; }
      .content-statement { grid-template-columns: 66px minmax(0, 1fr); padding: 10px 8px; }
      .content-points { grid-column: 2; }
      .content-terms { grid-column: 2; }
      .content-lesson { grid-column: 2; grid-row: auto; justify-self: start; margin-top: 7px; }
      .glossary-grid { grid-template-columns: 1fr; }
    }

    @media print {
      @page { size: A4 landscape; margin: 9mm; }
      body { background: #fff; print-color-adjust: exact; -webkit-print-color-adjust: exact; }
      .toolbar, .status, .shift-panel, .edit-actions { display: none !important; }
      .hero__inner, .overview, .scheme, .subject-content, .glossary, .detail-intro { width: 100%; }
      .hero__inner { padding: 10mm 0 7mm; }
      h1 { font-size: 30pt; }
      .intro { font-size: 10pt; }
      .overview { margin: -5mm 0 6mm; gap: 7px; }
      .overview__card { padding: 10px 12px; }
      .overview__card { box-shadow: none; }
      .section-intro { padding: 7px 9px; box-shadow: none; }
      .section-intro h2 { font-size: 15pt; }
      .section-intro p { font-size: 7pt; }
      .topic-block { break-before: page; margin: 0; box-shadow: none; }
      .topic__header { grid-template-columns: 12mm 1fr; padding: 6px 8px; }
      .topic__number { font-size: 17pt; }
      .topic__title { font-size: 16pt; }
      .topic__title .zh, .topic__intro--zh { font-size: 6.5pt; }
      .topic__intro { font-size: 8pt; }
      .subtopic { padding: 0 5px 5px; }
      .subtopic__header { grid-template-columns: 16mm 1fr; padding: 4px 6px; }
      .subtopic__number, .subtopic__title { font-size: 8pt; }
      .subtopic__title .zh { font-size: 6pt; }
      .content-statement { grid-template-columns: 18mm 1fr 24mm; padding: 4px 6px; }
      .content-ref, .content-statement h4 { font-size: 7pt; }
      .content-points { margin-top: 2px; padding-left: 12px; font-size: 6.2pt; line-height: 1.18; }
      .content-points li { margin: 1px 0; }
      .content-terms { margin-top: 2px; font-size: 5.4pt; }
      .content-lesson { min-width: 0; padding: 2px 3px; font-size: 5.2pt; }
      .detail-intro { break-before: page; }
      .unit { break-before: page; margin-bottom: 0; }
      .unit__header { margin-bottom: 4px; padding: 5px 8px; border-radius: 0; box-shadow: none; }
      .unit__header h2 { font-size: 9pt; }
      .unit__count { display: none; }
      .lesson-list { gap: 4px; }
      .lesson { break-inside: avoid; border-radius: 0; box-shadow: none; margin-bottom: 0; }
      .lesson__header { grid-template-columns: 36mm 1fr; }
      .lesson__grid { grid-template-columns: 1.05fr 1.45fr .85fr .8fr; }
      .panel, .lesson__meta, .lesson__enquiry { padding: 4px 6px; }
      .lesson__number { font-size: 9pt; }
      .lesson-status { padding: 1px 4px; font-size: 4.8pt; }
      .lesson__date, .lesson__focus { margin-top: 1px; font-size: 6.3pt; }
      .lesson__note { margin-top: 2px; font-size: 5.8pt; }
      .lesson__source { margin-top: 2px; font-size: 5.2pt; }
      .print-unit-label { display: block; margin-bottom: 2px; color: var(--muted); font-size: 5.3pt; font-weight: 800; }
      .kicker { font-size: 5.8pt; }
      .lesson__enquiry h3 { margin-top: 1px; font-size: 8pt; }
      .panel h4 { margin-bottom: 4px; font-size: 6.6pt; }
      .objectives li { margin-bottom: 3px; padding-left: 17px; line-height: 1.16; }
      .objectives li::before { width: 13px; height: 13px; font-size: 5.5pt; }
      .objective__en, .phase__task, .evidence-block div, .terms li, .formula { font-size: 6.1pt; line-height: 1.18; }
      .objective__zh, .phase__time, .phase__name { font-size: 5.7pt; line-height: 1.15; }
      .phases { gap: 3px; }
      .phase { padding: 3px 4px; border-radius: 3px; }
      .phase__head { gap: 3px; margin-bottom: 1px; }
      .evidence-block + .evidence-block { margin-top: 5px; padding-top: 4px; }
      .evidence-block strong { margin-bottom: 1px; font-size: 6pt; }
      .terms { padding-left: 11px; }
      .terms li { margin-bottom: 1px; }
      .formula { margin-top: 4px; padding-top: 3px; }
      .glossary { break-before: page; margin: 0; }
      .glossary-grid { grid-template-columns: repeat(3, 1fr); gap: 3px; }
      .glossary-card { break-inside: avoid; padding: 4px 5px; border-radius: 0; box-shadow: none; }
      .glossary-card h3 { font-size: 6.5pt; }
      .glossary-card h3 .zh, .glossary-card p { font-size: 5.8pt; line-height: 1.18; }
      .glossary-card__meta, .glossary__sources { font-size: 4.8pt; }
    }
  </style>
</head>
<body>
  <nav class="toolbar" aria-label="Scheme controls">
    <div class="toolbar__inner">
      <a class="brand" href="index.html">Investment course home</a>
      <input id="search" class="control search" type="search" placeholder="Search lessons, terms or objectives" aria-label="Search lessons">
      <select id="group-filter" class="control" aria-label="Filter by unit"></select>

  <script>
    (() => {
      'use strict';

      const dataElement = document.getElementById('course-data');
      const embeddedData = JSON.parse(dataElement.textContent);
      let state = structuredClone(embeddedData);
      let query = '';
      let groupFilter = 'all';
      let editing = false;

      const app = document.getElementById('app');
      const search = document.getElementById('search');
      const groupSelect = document.getElementById('group-filter');
      const editToggle = document.getElementById('edit-toggle');
      const status = document.getElementById('status');

      const escapeHtml = value => String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');

      const editable = (value, path, className = '') => {
        const blank = value ? '' : ' empty';
        const text = value || (editing ? 'Click to edit' : '');
        return `<span class="editable ${className}${blank}" data-path="${escapeHtml(path)}" ${editing ? 'contenteditable="true" spellcheck="true"' : ''}>${escapeHtml(text)}</span>`;
      };

      const setStatus = message => { status.textContent = message; };

      function setByPath(root, path, value) {
        const parts = path.split('.');
        let target = root;
        for (let i = 0; i < parts.length - 1; i += 1) target = target[parts[i]];
        target[parts.at(-1)] = value;
      }

      function fillGroupSelect() {
        groupSelect.innerHTML = '<option value="all">All units</option>' + state.groups.map(group =>
          `<option value="${escapeHtml(group.id)}">${escapeHtml(group.number)} ${escapeHtml(group.titleEn)}</option>`
        ).join('');
        groupSelect.value = state.groups.some(group => group.id === groupFilter) ? groupFilter : 'all';
      }

      function lessonSearchText(lesson) {
        return JSON.stringify(lesson).toLowerCase();
      }

      function renderOverview() {
        return `
          <section class="overview" aria-label="Course architecture">
            <article class="overview__card">
              <h2>${editable(state.architectureTitle, 'architectureTitle')}</h2>
              <p>${editable(state.architectureEn, 'architectureEn')}</p>
              <p class="zh">${editable(state.architectureZh, 'architectureZh')}</p>
            </article>
            <article class="overview__card">
              <h2>${editable(state.progressionTitle, 'progressionTitle')}</h2>
              <p>${editable(state.progression, 'progression')}</p>
            </article>
            <article class="overview__card">
              <h2>${editable(state.planningTitle, 'planningTitle')}</h2>
              <p>${editable(state.planningNotes, 'planningNotes')}</p>
            </article>
          </section>`;
      }

      function renderSubjectContent(visibleLessons) {
        const topicMarkup = state.topics.map((topic, topicIndex) => {
          const subtopics = state.groups.filter(group => group.topicId === topic.id).map(group => {
            const groupIndex = state.groups.indexOf(group);
            const lessons = visibleLessons.filter(lesson => lesson.groupId === group.id);
            if (!lessons.length) return '';
            const statements = lessons.map(lesson => {
              const lessonIndex = state.lessons.indexOf(lesson);
              const points = lesson.contentPoints.map((point, pointIndex) =>
                `<li>${editable(point, `lessons.${lessonIndex}.contentPoints.${pointIndex}`)}</li>`
              ).join('');
              const termLinks = lesson.definitions.map(definition =>
                `<a href="#term-${escapeHtml(definition.key)}">${escapeHtml(definition.term)}</a>`
              ).join(' · ');
              return `
                <article class="content-statement">
                  <div class="content-ref">${editable(lesson.contentRef, `lessons.${lessonIndex}.contentRef`)}</div>
                  <h4>${editable(lesson.focus, `lessons.${lessonIndex}.focus`)}</h4>
                  <ul class="content-points">${points}</ul>
                  <div class="content-terms"><strong>Key terms:</strong> ${termLinks}</div>
                  <div class="content-lesson">Lesson ${lesson.number}<br>${escapeHtml(lesson.date)}${lesson.status === 'taught' ? '<br><strong>Taught</strong>' : ''}</div>
                </article>`;
            }).join('');
            return `
              <section class="subtopic">
                <header class="subtopic__header">
                  <div class="subtopic__number">${editable(group.number, `groups.${groupIndex}.number`)}</div>
                  <div class="subtopic__title">${editable(group.titleEn, `groups.${groupIndex}.titleEn`)} <span class="zh">${editable(group.titleZh, `groups.${groupIndex}.titleZh`)}</span></div>
                </header>
                ${statements}
              </section>`;
          }).join('');
          if (!subtopics) return '';
          return `
            <article class="topic-block" id="${escapeHtml(topic.id)}">
              <header class="topic__header">
                <div class="topic__number">${editable(topic.number, `topics.${topicIndex}.number`)}</div>
                <h2 class="topic__title">${editable(topic.titleEn, `topics.${topicIndex}.titleEn`)} <span class="zh">${editable(topic.titleZh, `topics.${topicIndex}.titleZh`)}</span></h2>
                <p class="topic__intro">${editable(topic.introEn, `topics.${topicIndex}.introEn`)}</p>
                <p class="topic__intro topic__intro--zh">${editable(topic.introZh, `topics.${topicIndex}.introZh`)}</p>
              </header>
              ${subtopics}
            </article>`;
        }).join('');

        return `
          <section class="subject-content" id="subject-content" aria-labelledby="subject-content-title">
            <header class="section-intro">
              <div class="kicker">Syllabus hierarchy</div>
              <h2 id="subject-content-title">${editable(state.subjectContentTitle, 'subjectContentTitle')}</h2>
              <p>${editable(state.subjectContentIntro, 'subjectContentIntro')}</p>
            </header>
            ${topicMarkup}
          </section>`;
      }

      function renderGlossary(visibleLessons) {
        const entries = new Map();
        visibleLessons.forEach(lesson => {
          const lessonIndex = state.lessons.indexOf(lesson);
          lesson.definitions.forEach((definition, definitionIndex) => {
            if (!entries.has(definition.key)) {
              entries.set(definition.key, {
                ...definition,
                refs: [],
                definitionPath: `lessons.${lessonIndex}.definitions.${definitionIndex}.definition`
              });
            }
            const entry = entries.get(definition.key);
            if (!entry.refs.includes(lesson.contentRef)) entry.refs.push(lesson.contentRef);
          });
        });
        const cards = [...entries.values()].sort((a, b) => a.term.localeCompare(b.term)).map(entry => `
          <article class="glossary-card" id="term-${escapeHtml(entry.key)}">
            <h3>${escapeHtml(entry.term)}${entry.zh ? ` <span class="zh">${escapeHtml(entry.zh)}</span>` : ''}</h3>
            <p>${editable(entry.definition, entry.definitionPath)}</p>
            <div class="glossary-card__meta">Content ${entry.refs.map(escapeHtml).join(', ')} · ${escapeHtml(entry.source)}</div>
          </article>`).join('');
        return `
          <section class="glossary" id="glossary" aria-labelledby="glossary-title">
            <header class="section-intro">
              <div class="kicker">Course glossary</div>
              <h2 id="glossary-title">${editable(state.glossaryTitle, 'glossaryTitle')}</h2>
              <p>${editable(state.glossaryIntro, 'glossaryIntro')}</p>
              <div class="glossary__sources">Sources: ${state.glossarySources.map(escapeHtml).join(' · ')}</div>
            </header>
            <div class="glossary-grid">${cards}</div>
          </section>`;
      }

      function renderLesson(lesson, lessonIndex) {
        const lessonGroup = state.groups.find(group => group.id === lesson.groupId);
        const objectives = lesson.objectives.map((objective, objectiveIndex) => `
          <li>
            <span class="objective__en">${editable(objective.en, `lessons.${lessonIndex}.objectives.${objectiveIndex}.en`)}</span>
            <span class="objective__zh">${editable(objective.zh, `lessons.${lessonIndex}.objectives.${objectiveIndex}.zh`)}</span>
          </li>`).join('');

        const phases = lesson.phases.map((phase, phaseIndex) => `
          <div class="phase">
            <div class="phase__head">
              <span class="phase__time">${editable(phase.time, `lessons.${lessonIndex}.phases.${phaseIndex}.time`)}</span>
              <span class="phase__name">${editable(phase.name, `lessons.${lessonIndex}.phases.${phaseIndex}.name`)}</span>
            </div>
            <div class="phase__task">${editable(phase.task, `lessons.${lessonIndex}.phases.${phaseIndex}.task`)}</div>
          </div>`).join('');

        const terms = lesson.terms.map((term, termIndex) =>
          `<li>${editable(term, `lessons.${lessonIndex}.terms.${termIndex}`)} <a class="definition-link" href="#term-${escapeHtml(lesson.definitions[termIndex]?.key || '')}">definition</a></li>`
        ).join('');

        return `
          <article class="lesson${lesson.status === 'taught' ? ' lesson--taught' : ''}" id="${escapeHtml(lesson.id)}" data-lesson-id="${escapeHtml(lesson.id)}">
            <header class="lesson__header">
              <div class="lesson__meta">
                <div class="print-unit-label">${escapeHtml(lessonGroup?.titleEn || '')}</div>
                <div class="lesson__number-row">
                  <div class="lesson__number">Lesson ${lesson.number}</div>
                  ${lesson.status === 'taught' ? '<span class="lesson-status">Taught</span>' : ''}
                </div>
                <div class="lesson__content-ref">Content ${editable(lesson.contentRef, `lessons.${lessonIndex}.contentRef`)}</div>
                <div class="lesson__date">${editable(lesson.date, `lessons.${lessonIndex}.date`)}</div>
                <div class="lesson__focus">${editable(lesson.focus, `lessons.${lessonIndex}.focus`)}</div>
                ${lesson.scheduleNote || editing ? `<div class="lesson__note">${editable(lesson.scheduleNote, `lessons.${lessonIndex}.scheduleNote`)}</div>` : ''}
                ${lesson.sourceDeck ? `<div class="lesson__source"><strong>Source of truth</strong><br>${escapeHtml(lesson.sourceDeck)} · ${escapeHtml(lesson.sourceSlides || '')}</div>` : ''}
                <div class="edit-actions">
                  <button class="mini-button" type="button" data-action="up" data-id="${escapeHtml(lesson.id)}">Move up</button>
                  <button class="mini-button" type="button" data-action="down" data-id="${escapeHtml(lesson.id)}">Move down</button>
                  <button class="mini-button" type="button" data-action="toggle-status" data-id="${escapeHtml(lesson.id)}">Mark ${lesson.status === 'taught' ? 'planned' : 'taught'}</button>
                  <button class="mini-button" type="button" data-action="duplicate" data-id="${escapeHtml(lesson.id)}">Duplicate</button>
                  <button class="mini-button" type="button" data-action="remove" data-id="${escapeHtml(lesson.id)}">Remove</button>
                </div>
              </div>
              <div class="lesson__enquiry">
                <div class="kicker">Enquiry question</div>
                <h3>${editable(lesson.question, `lessons.${lessonIndex}.question`)}</h3>
              </div>
            </header>
            <div class="lesson__grid">
              <section class="panel panel--objectives">
                <h4>Three bilingual objectives</h4>
                <ol class="objectives">${objectives}</ol>
              </section>
              <section class="panel panel--progression">
                <h4>${editable(lesson.sequenceTitle || '40-minute progression', `lessons.${lessonIndex}.sequenceTitle`)}</h4>
                <div class="phases">${phases}</div>
              </section>
              <section class="panel panel--evidence">
                <h4>Student evidence</h4>
                <div class="evidence-block"><strong>Output</strong><div>${editable(lesson.output, `lessons.${lessonIndex}.output`)}</div></div>
                <div class="evidence-block"><strong>Checkpoint</strong><div>${editable(lesson.checkpoint, `lessons.${lessonIndex}.checkpoint`)}</div></div>
              </section>
              <aside class="panel panel--knowledge">
                <h4>Key knowledge</h4>
                <ul class="terms">${terms}</ul>
                ${lesson.formula || editing ? `<div class="formula"><strong>Formula</strong><br>${editable(lesson.formula, `lessons.${lessonIndex}.formula`)}</div>` : ''}
              </aside>
            </div>
          </article>`;
      }

      function renderUnit(group, groupIndex, visibleLessons) {
        const titlePath = `groups.${groupIndex}`;
        return `
          <section class="unit" id="${escapeHtml(group.id)}">
            <header class="unit__header">
              <h2>${editable(group.number, `${titlePath}.number`)} ${editable(group.titleEn, `${titlePath}.titleEn`)} <span class="zh">${editable(group.titleZh, `${titlePath}.titleZh`)}</span></h2>
              <div class="unit__count">${visibleLessons.length} lesson${visibleLessons.length === 1 ? '' : 's'} shown</div>
              <div class="edit-actions"><button class="mini-button" type="button" data-action="add" data-group-id="${escapeHtml(group.id)}">Add lesson to this unit</button></div>
            </header>
            <div class="lesson-list">${visibleLessons.map(lesson => renderLesson(lesson, state.lessons.indexOf(lesson))).join('')}</div>
          </section>`;
      }

      function render() {
        document.body.classList.toggle('editing', editing);
        editToggle.setAttribute('aria-pressed', String(editing));
        editToggle.textContent = editing ? 'Finish editing' : 'Edit mode';
        fillGroupSelect();

        const needle = query.trim().toLowerCase();
        const visible = state.lessons.filter(lesson =>
          (groupFilter === 'all' || lesson.groupId === groupFilter) &&
          (!needle || lessonSearchText(lesson).includes(needle))
        );
        const definitionCount = new Set(state.lessons.flatMap(lesson => lesson.definitions.map(definition => definition.key))).size;

        const hero = `
          <section class="hero">
            <div class="hero__inner">
              <p class="eyebrow">${editable(state.eyebrow, 'eyebrow')}</p>
              <h1>${editable(state.title, 'title')}</h1>
              <p class="intro">${editable(state.introEn, 'introEn')}</p>
              <p class="intro intro--zh">${editable(state.introZh, 'introZh')}</p>
              <div class="metrics">
                <span class="metric">${state.lessons.length} lessons</span>
                <span class="metric">${state.lessons.filter(lesson => lesson.status === 'taught').length} taught · ${state.lessons.filter(lesson => lesson.status !== 'taught').length} planned</span>
                <span class="metric">${state.topics.length} topics · ${state.groups.length} subtopics</span>
                <span class="metric">${definitionCount} key definitions</span>
                <span class="metric">3 objectives per lesson</span>
                <span class="metric">6 phases per lesson</span>
              </div>
            </div>
          </section>`;

        const units = state.groups.map((group, groupIndex) => {
          const lessons = visible.filter(lesson => lesson.groupId === group.id);
          return lessons.length || editing ? renderUnit(group, groupIndex, lessons) : '';
        }).join('');

        const detailIntro = `
          <header class="detail-intro">
            <div class="kicker">Scheme of work</div>
            <h2>Detailed lesson sequence</h2>
            <p>Dates, enquiry questions, learning objectives, classroom progression and evidence checks translate the numbered subject content into teachable 40-minute lessons.</p>
          </header>`;
        app.innerHTML = hero + renderOverview() + renderSubjectContent(visible) + detailIntro + `<div class="scheme">${units || '<div class="no-results">No lessons match this search.</div>'}</div>` + renderGlossary(visible);
        setStatus(`${visible.length} of ${state.lessons.length} lessons shown${editing ? ' · click outlined text to edit' : ''}`);
      }

      function renumberLessons() {
        let number = 1;
        state.groups.forEach(group => {
          state.lessons.filter(lesson => lesson.groupId === group.id).forEach((lesson, contentIndex) => {
            lesson.number = number++;
            lesson.contentRef = `${group.number}.${contentIndex + 1}`;
          });
        });
      }

      function blankLesson(groupId) {
        return {
          id: `lesson-${Date.now()}`,
          number: state.lessons.length + 1,
          groupId,
          date: 'Wed Sep 2',
          focus: 'New lesson focus',
          scheduleNote: '',
          question: 'Add an answerable enquiry question.',
          contentRef: '',
          contentPoints: [
            'definition of the lesson\'s central concept',
            'application of the concept to a relevant investment context',
            'interpretation or evaluation using appropriate evidence'
          ],
          objectives: [
            { en: 'Add objective one.', zh: '添加目标一。' },
            { en: 'Add objective two.', zh: '添加目标二。' },
            { en: 'Add objective three.', zh: '添加目标三。' }
          ],
          phases: [
            { time: '0-4', name: 'Retrieve', task: 'Retrieve prior knowledge.' },
            { time: '4-7', name: 'Judge', task: 'Commit to an initial judgement.' },
            { time: '7-15', name: 'Learn', task: 'Learn through a concise model.' },
            { time: '15-25', name: 'Practise', task: 'Practise with feedback.' },
            { time: '25-35', name: 'Analyse', task: 'Analyse an unfamiliar case.' },
            { time: '35-40', name: 'Exit', task: 'Submit an individual response.' }
          ],
          output: 'Define the student evidence to collect.',
          checkpoint: 'Define the success criterion.',
          terms: ['new term（新术语）'],
          definitions: [{
            key: `new-term-${Date.now()}`,
            term: 'new term',
            zh: '新术语',
            definition: 'Add a precise, self-contained classroom definition.',
            source: 'Syllabus-specific definition',
            sourceTerm: 'new term'
          }],
          formula: '',
          status: 'planned',
          sourceDeck: '',
          sourceSlides: '',
          sourceSha256: '',
          sequenceTitle: '40-minute progression'
        };
      }

      function handleAction(button) {
        const action = button.dataset.action;
        if (action === 'add') {
          const groupId = button.dataset.groupId;
          const indices = state.lessons.map((lesson, index) => ({ lesson, index })).filter(item => item.lesson.groupId === groupId);
          const insertAt = indices.length ? indices.at(-1).index + 1 : state.lessons.length;
          state.lessons.splice(insertAt, 0, blankLesson(groupId));
        } else {
          const index = state.lessons.findIndex(lesson => lesson.id === button.dataset.id);
          if (index < 0) return;
          const lesson = state.lessons[index];
          const sameGroup = state.lessons.map((item, itemIndex) => ({ item, itemIndex })).filter(entry => entry.item.groupId === lesson.groupId);
          const position = sameGroup.findIndex(entry => entry.itemIndex === index);
          if (action === 'up' && position > 0) {
            const otherIndex = sameGroup[position - 1].itemIndex;
            [state.lessons[index], state.lessons[otherIndex]] = [state.lessons[otherIndex], state.lessons[index]];
          }
          if (action === 'down' && position < sameGroup.length - 1) {
            const otherIndex = sameGroup[position + 1].itemIndex;
            [state.lessons[index], state.lessons[otherIndex]] = [state.lessons[otherIndex], state.lessons[index]];
          }
          if (action === 'duplicate') {
            const copy = structuredClone(lesson);
            copy.id = `lesson-${Date.now()}`;
            copy.focus += ' (copy)';
            copy.status = 'planned';
            copy.sourceDeck = '';
            copy.sourceSlides = '';
            copy.sourceSha256 = '';
            copy.sequenceTitle = '40-minute progression';
            state.lessons.splice(index + 1, 0, copy);
          }
          if (action === 'toggle-status') lesson.status = lesson.status === 'taught' ? 'planned' : 'taught';
          if (action === 'remove' && confirm(`Remove Lesson ${lesson.number}: ${lesson.focus}?`)) state.lessons.splice(index, 1);
        }
        renumberLessons();
        render();
      }

      function parseLessonDate(lesson) {
        const match = lesson.date.replace('*', '').match(/(?:Wed|Fri)\s+([A-Z][a-z]{2})\s+(\d+)/);
        if (!match) return null;
        const year = lesson.number >= state.yearRolloverLesson ? state.calendarStartYear + 1 : state.calendarStartYear;
        return new Date(`${match[1]} ${match[2]}, ${year} 12:00:00`);
      }

      function formatLessonDate(date, provisional) {
        const weekday = date.toLocaleDateString('en-US', { weekday: 'short' });
        const month = date.toLocaleDateString('en-US', { month: 'short' });
        return `${weekday} ${month} ${date.getDate()}${provisional ? '*' : ''}`;
      }

      function shiftPacing() {
        const from = Number(document.getElementById('shift-from').value);
        const weeks = Number(document.getElementById('shift-weeks').value);
        if (!Number.isInteger(from) || !Number.isInteger(weeks)) return setStatus('Enter whole numbers for the starting lesson and week shift.');
        let changed = 0;
        let protectedCount = 0;
        state.lessons.forEach(lesson => {
          if (lesson.number < from) return;
          if (lesson.status === 'taught') {
            protectedCount += 1;
            return;
          }
          const date = parseLessonDate(lesson);
          if (!date) return;
          const provisional = lesson.date.includes('*');
          date.setDate(date.getDate() + weeks * 7);
          lesson.date = formatLessonDate(date, provisional);
          changed += 1;
        });
        render();
        setStatus(`Shifted ${changed} planned lesson dates by ${weeks} week${Math.abs(weeks) === 1 ? '' : 's'}${protectedCount ? `; ${protectedCount} taught lesson${protectedCount === 1 ? '' : 's'} protected` : ''}.`);
      }

      function saveDraft() {
        localStorage.setItem(state.storageKey, JSON.stringify(state));
        setStatus('Draft saved in this browser. Download updated HTML for a portable, permanent copy.');
      }

      function restoreDraft() {
        const saved = localStorage.getItem(state.storageKey);
        if (!saved) return setStatus('No browser draft is saved yet.');
        state = JSON.parse(saved);
        render();
        setStatus('Browser draft restored.');
      }

      function downloadHtml() {
        const clone = document.documentElement.cloneNode(true);
        const cloneData = clone.querySelector('#course-data');
        const safeJson = JSON.stringify(state, null, 2).replaceAll('</script', '<\\/script');
        cloneData.textContent = `\n${safeJson}\n  `;
        clone.querySelector('#app').innerHTML = '';
        clone.querySelector('#status').textContent = '';
        clone.querySelector('body').classList.remove('editing');
        const html = '<!doctype html>\n' + clone.outerHTML;
        const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = 'Investment Scheme of Work - updated.html';
        link.click();
        URL.revokeObjectURL(url);
        setStatus('Downloaded a new self-contained HTML file containing the current edits.');
      }

      search.addEventListener('input', event => { query = event.target.value; render(); });
      groupSelect.addEventListener('change', event => { groupFilter = event.target.value; render(); });
      editToggle.addEventListener('click', () => { editing = !editing; render(); });
      document.getElementById('save-draft').addEventListener('click', saveDraft);
      document.getElementById('restore-draft').addEventListener('click', restoreDraft);
      document.getElementById('download').addEventListener('click', downloadHtml);
      document.getElementById('print').addEventListener('click', () => window.print());
      document.getElementById('apply-shift').addEventListener('click', shiftPacing);

      document.addEventListener('input', event => {
        const target = event.target.closest('[data-path]');
        if (!target || !editing) return;
        target.classList.remove('empty');
        const definitionMatch = target.dataset.path.match(/^lessons\.(\d+)\.definitions\.(\d+)\.definition$/);
        const definitionKey = definitionMatch
          ? state.lessons[Number(definitionMatch[1])].definitions[Number(definitionMatch[2])].key
          : null;
        setByPath(state, target.dataset.path, target.textContent.trim());
        if (definitionKey) {
          state.lessons.forEach(lesson => lesson.definitions.forEach(definition => {
            if (definition.key === definitionKey) definition.definition = target.textContent.trim();
          }));
        }
        setStatus('Unsaved edit · use Save draft or Download updated HTML.');
      });

      document.addEventListener('keydown', event => {
        if (event.target.matches('[contenteditable="true"]') && event.key === 'Enter') {
          event.preventDefault();
          event.target.blur();
        }
      });

      document.addEventListener('click', event => {
        const button = event.target.closest('[data-action]');
        if (button && editing) handleAction(button);
      });

      render();
    })();
  </script>
</body>
</html>
