<text x="1260" y="759" fill="#f6ce68" font-family="Arial, Microsoft YaHei, sans-serif" font-size="39" font-weight="700">£75,000</text>
<text x="85" y="862" fill="#aabfcf" font-family="Arial, Microsoft YaHei, sans-serif" font-size="25" font-weight="400">Illustrative rates • All after-tax profit kept • No borrowing or other savings</text>
