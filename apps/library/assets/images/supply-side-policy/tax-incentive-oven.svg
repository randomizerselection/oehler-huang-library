<rect x="489" y="305" width="49" height="76" rx="7" fill="#52c8ca"/>
<rect x="551" y="305" width="49" height="76" rx="7" fill="#52c8ca"/>
<rect x="613" y="305" width="49" height="76" rx="7" fill="#52c8ca"/>
<rect x="675" y="305" width="49" height="76" rx="7" fill="#52c8ca"/>
<text x="115" y="429" fill="#efb59a" font-family="Arial, Microsoft YaHei, sans-serif" font-size="34" font-weight="400">Tax paid: £30,000</text>
<text x="115" y="484" fill="#78dce0" font-family="Arial, Microsoft YaHei, sans-serif" font-size="44" font-weight="700">Profit kept: £70,000</text>
<text x="115" y="544" fill="#ffffff" font-family="Arial, Microsoft YaHei, sans-serif" font-size="29" font-weight="700">£5,000 short of the oven</text>
<text x="115" y="585" fill="#c9d8e5" font-family="Arial, Microsoft YaHei, sans-serif" font-size="25" font-weight="400">每个色块 = £10,000</text>
<rect x="835" y="208" width="680" height="408" rx="12" fill="#18344d"/>
<text x="865" y="264" fill="#ffffff" font-family="Arial, Microsoft YaHei, sans-serif" font-size="40" font-weight="700">20% corporation tax</text>
