<text x="115" y="711" fill="#f6ce68" font-family="Arial, Microsoft YaHei, sans-serif" font-size="35" font-weight="700">£10,000 less tax → £10,000 more to invest</text>
<text x="115" y="760" fill="#c9d8e5" font-family="Arial, Microsoft YaHei, sans-serif" font-size="31" font-weight="400">减税 → 更多可用于投资的税后利润</text>
