<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">A tax cut can make investment affordable</title>
<desc id="desc">Alex earns 100,000 pounds before tax. At 30 percent tax, 70,000 pounds remain; at 20 percent tax, 80,000 pounds remain. The extra 10,000 pounds makes a 75,000-pound oven affordable. All profit is kept and there are no other funds.</desc>
<rect width="1600" height="900" fill="#10263b"/>
<text x="85" y="98" fill="#ffffff" font-family="Arial, Microsoft YaHei, sans-serif" font-size="51" font-weight="700">Tax incentives: more profit available to invest</text>
<text x="85" y="155" fill="#c9d8e5" font-family="Arial, Microsoft YaHei, sans-serif" font-size="31" font-weight="400">Alex’s bakery • £100,000 profit before tax in both cases</text>
<rect x="85" y="208" width="680" height="408" rx="12" fill="#18344d"/>
<text x="115" y="264" fill="#ffffff" font-family="Arial, Microsoft YaHei, sans-serif" font-size="40" font-weight="700">30% corporation tax</text>
<rect x="117" y="305" width="49" height="76" rx="7" fill="#eb936d"/>
<rect x="179" y="305" width="49" height="76" rx="7" fill="#eb936d"/>
<rect x="241" y="305" width="49" height="76" rx="7" fill="#eb936d"/>
