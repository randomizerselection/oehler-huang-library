<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="Random Student Selector is a browser classroom app for timed thinking, attendance-aware random selection, formative outcomes, and live summaries."
    >
    <meta name="theme-color" content="#17312f">
    <title>Random Student Selector</title>
    <link rel="icon" href="assets/icon.png">
    <link rel="stylesheet" href="/student-selector/selector.css">
  </head>
  <body>
    <main id="student-selector-app" class="selector-root" data-student-selector-root></main>
    <script src="/assets/js/platform-shell.js"></script>
    <script src="/student-selector/selector.js"></script>
    <script>
      (async () => {
        await window.OHPlatform.ready();
        if (window.OHPlatform.session.account?.role !== "teacher") {
          location.replace(`/?signin=1&next=${encodeURIComponent(location.pathname + location.search)}`);
          return;
        }
        const lessonContext = {
          content_id: new URLSearchParams(location.search).get("lesson"),
          learning_assignment_id: new URLSearchParams(location.search).get("assignment")
        };
        window.StudentSelector.mount(document.getElementById("student-selector-app"), {
          basePath: "/student-selector/",
          defaultClassId: new URLSearchParams(location.search).get("class"),
          lessonContext,
          ...window.OHPlatform.selectorAdapters(lessonContext)
        });
      })();
    </script>
  </body>
</html>
