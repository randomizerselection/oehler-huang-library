<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="Random Student Selector is a browser classroom app for timed thinking, attendance-aware random selection, formative outcomes, and live summaries."
    >
    <meta name="theme-color" content="#17312f">
    <title>Random Student Selector</title>
    <link rel="icon" href="assets/icon.png">
    <link rel="stylesheet" href="/student-selector/selector.css">
    <link rel="stylesheet" href="/assets/css/app-shell.css">
  </head>
  <body>
    <header class="oh-app-header oh-app-header--full" aria-label="Platform navigation">
      <a class="oh-app-brand" href="/" aria-label="Oehler-Huang Learning Platform home"><span class="oh-app-mark" aria-hidden="true">OH</span><span><strong>Oehler-Huang</strong><small>Learning Platform</small></span></a>
      <nav class="oh-primary-nav" aria-label="Primary destinations"><a data-oh-nav="economics" href="/economics/">Economics</a><a data-oh-nav="investment" href="/investment-analysis/">Investment</a><a data-oh-nav="homework" href="/mark/">Homework</a></nav>
      <div class="oh-header-account" data-oh-account-dock></div>
    </header>
    <div class="oh-context-bar oh-context-bar--full" style="--oh-context-accent:#7ef0b5"><strong class="oh-context-label">Teacher tools</strong><nav class="oh-context-nav" aria-label="Teacher tools"><a href="/selector/" aria-current="page">Student selector</a><a href="/mark/teacher">Assignment library</a><a href="/mark/single">Single marking</a><a href="/mark/batch">Batch marking</a></nav></div>
    <main id="student-selector-app" class="selector-root" data-student-selector-root></main>
    <script src="/assets/js/platform-shell.js?v=20260812.1"></script>
    <script src="/student-selector/selector.js"></script>
    <script>
      (async () => {
        await window.OHPlatform.ready();
        if (window.OHPlatform.session.account?.role !== "teacher") {
          location.replace(`/?signin=1&next=${encodeURIComponent(location.pathname + location.search)}`);
          return;
        }
        const lessonContext = {
          content_id: new URLSearchParams(location.search).get("lesson"),
          learning_assignment_id: new URLSearchParams(location.search).get("assignment")
        };
        window.StudentSelector.mount(document.getElementById("student-selector-app"), {
          basePath: "/student-selector/",
          defaultClassId: new URLSearchParams(location.search).get("class"),
          lessonContext,
          ...window.OHPlatform.selectorAdapters(lessonContext)
        });
      })();
    </script>
  </body>
</html>
