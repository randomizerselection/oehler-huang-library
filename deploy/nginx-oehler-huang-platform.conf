upstream oehler_huang_platform {
    server 127.0.0.1:8787;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name oehlerhuang.com www.oehlerhuang.com mark.oehlerhuang.com;

    client_max_body_size 520m;

    location = /student-selector/assets/students.csv { return 404; }
    location = /student-selector/ { return 308 /selector/; }
    location = /student-selector/index.html { return 308 /selector/; }

    location /student-selector/ {
        root /opt/oehler-huang-platform/current/apps;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=300" always;
    }

    location /src/ {
        root /opt/oehler-huang-platform/current/apps/platform;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=300" always;
    }

    location ~* ^/(?:assets|lessons|investment-analysis|economics)/.*\.(?:css|js|mjs|png|jpe?g|webp|svg|ico|woff2?|mp3|mp4|pdf)$ {
        root /opt/oehler-huang-platform/current/apps/library;
        try_files $uri @platform;
        add_header Cache-Control "public, max-age=300" always;
    }

    location /api/ { proxy_pass http://oehler_huang_platform; include proxy_params; proxy_set_header X-Forwarded-Proto $scheme; }
    location /selector/ { proxy_pass http://oehler_huang_platform; include proxy_params; proxy_set_header X-Forwarded-Proto $scheme; }
    location /mark/ { proxy_pass http://oehler_huang_platform; include proxy_params; proxy_set_header X-Forwarded-Proto $scheme; }
    location @platform { proxy_pass http://oehler_huang_platform; include proxy_params; proxy_set_header X-Forwarded-Proto $scheme; }
    location / { proxy_pass http://oehler_huang_platform; include proxy_params; proxy_set_header X-Forwarded-Proto $scheme; }
}
